/* ---------- STORAGE ---------- */
function loadSavedChats(){
 try{
  savedChats=JSON.parse(localStorage.getItem("moonbot_v7_chats")||"[]");
  if(!Array.isArray(savedChats))savedChats=[];

}

function saveSavedChats(){
 localStorage.setItem("moonbot_v7_chats",JSON.stringify(savedChats));
}

loadSavedChats();

/* ---------- MODES ---------- */
document.querySelectorAll(".mode").forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  mode=btn.dataset.mode;

  const names={
   standard:"Standard",
   medium:"Medium",

/* ---------- NORMALIZE ---------- */
function normalize(text){
 let t=text.toLowerCase().trim();

 const map={
  "ape":"apa","sape":"siapa","camne":"macam mana",
  "nk":"nak","tk":"tak","tkde":"tak ada","takde":"tak ada",
  "xde":"tak ada","dh":"dah","yg":"yang","dgn":"dengan",
  "kat":"di","org":"orang","kwn":"kawan","klu":"kalau",
  "mcm":"macam","bg":"bagi","bgi":"bagi","blh":"boleh",
  "takleh":"tak boleh","xleh":"tak boleh","skrg":"sekarang",
  "sbb":"sebab","mkn":"makan","tgh":"tengah","dkt":"dekat",
  "nkbuat":"nak buat"
 };

 for(const word in map){
  const r=new RegExp("\\b"+word+"\\b","g");
  t=t.replace(r,map[word]);
 }
 return t;
}

/* ---------- MATH ---------- */
function solveMath(text){
 let t=text.toLowerCase()
  .replace(/,/g,"")
  .replace(/×/g,"*")
  .replace(/÷/g,"/")
  .replace(/\bx\b/g,"*");

 let m=t.match(/(-?\d+(?:\.\d+)?)\s*%\s*(?:daripada|of)\s*(-?\d+(?:\.\d+)?)/);
 if(m){
  return parseFloat(m[1])/100*parseFloat(m[2]);
 }

 m=t.match(/(-?\d+(?:\.\d+)?)\s+daripada\s+(-?\d+(?:\.\d+)?)/);
 if(m && parseFloat(m[2])!==0){
  return (parseFloat(m[1])/parseFloat(m[2])*100).toFixed(2)+"%";
 }

 if(/^[0-9+\-*/().\s]+$/.test(t)&&/[+\-*/]/.test(t)){
  try{
   const result=Function('"use strict";return ('+t+')')();
   if(Number.isFinite(result))return result;
  }catch(e){}
 }

 return null;
}

/* ---------- ANSWER ENGINE ---------- */
function answerQuestion(raw){

 const q=normalize(raw);
 const math=solveMath(q);

 if(math!==null){
  return "🧮 Jawapan: <b>"+math+"</b>";
 }

 if(q==="hai"||q==="hello"||q==="helo"){
  return "🌙 Hai! Saya MoonBot V7 Ultra. Apa yang nak kau tanya?";
 }

 for(const item of knowledge){
  if(item[0].test(q))return item[1];
 }

 return "🧠 Saya belum mempunyai jawapan khusus untuk soalan itu dalam knowledge base saya. Cuba tanya tentang Matematik, Sains, Sejarah, Malaysia, Bahasa, coding, sukan atau PKSK.";
}

/* ---------- MODE RESPONSE ---------- */
function formatByMode(text){

 if(mode==="fast"){
  return text
   .replace(/<[^>]*>/g,"")
   .split(".")[0]+".";
 }

 if(mode==="medium"){
  return text;
 }

 return text;
}

/* ---------- TIME ---------- */
function now(){
 return new Date().toLocaleTimeString("ms-MY",{
  hour:"2-digit",minute:"2-digit"
 });
}

/* ---------- ESCAPE ---------- */
function escapeHTML(text){
 return text.replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

/* ---------- MESSAGE ---------- */
function addUser(text){
 const div=document.createElement("div");
 div.className="message user";
 div.innerHTML="👤 <b>Kamu:</b> "+escapeHTML(text)+
  '<span class="time">'+now()+"</span>";
 chat.appendChild(div);
}

function addBot(text){
 const div=document.createElement("div");
 div.className="message bot";
 div.innerHTML="🌙 <b>MoonBot:</b> "+text+
  '<span class="time">'+now()+"</span>";
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

/* ---------- SEND ---------- */
function sendMessage(){

 const raw=input.value.trim();
 if(!raw)return;

 addUser(raw);

 const reply=formatByMode(answerQuestion(raw));
 addBot(reply);

 currentChat.push({
  user:raw,
  bot:reply,
  time:now()
 });

 input.value="";
 input.style.height="48px";
 chat.scrollTop=chat.scrollHeight;
}

/* ---------- NEW CHAT ---------- */
document.getElementById("newChat").onclick=()=>{

 if(currentChat.length>0){

  savedChats.unshift({
   title:currentChat[0].user.slice(0,45),
   messages:currentChat,
   date:new Date().toLocaleDateString("ms-MY")
  });

  savedChats=savedChats.slice(0,30);
  saveSavedChats();
 }

 currentChat=[];
 chat.innerHTML="";

 addBot("🌙 Chat baharu dimulakan. Apa yang nak kau tanya?");
 loadHistoryList();
};

/* ---------- HISTORY ---------- */
function loadHistoryList(){

 historyList.innerHTML="";

 savedChats.forEach((item,index)=>{

  const div=document.createElement("div");
  div.className="historyItem";
  div.textContent="🕘 "+item.title;

  div.onclick=()=>openHistory(index);

  historyList.appendChild(div);
 });
}

function openHistory(index){

 const item=savedChats[index];

 if(!item)return;

 chat.innerHTML="";

 item.messages.forEach(msg=>{
  addUser(msg.user);
  addBot(msg.bot);
 });

 currentChat=[...item.messages];
}

/* ---------- HISTORY BUTTON ---------- */
document.getElementById("historyBtn").onclick=()=>{

 if(historyList.style.display==="none"){
  historyList.style.display="block";
 }else{
  historyList.style.display="block";
 }

 loadHistoryList();
};

/* ---------- CLEAR HISTORY ---------- */
document.getElementById("clearHistory").onclick=()=>{

 if(!confirm("Padam semua history MoonBot?"))return;

 savedChats=[];
 currentChat=[];

 localStorage.removeItem("moonbot_v7_chats");

 loadHistoryList();

 chat.innerHTML="";
 addBot("🗑️ History telah dipadam.");
};

/* ---------- ENTER / SHIFT+ENTER ---------- */
input.addEventListener("keydown",e=>{

 if(e.key==="Enter"&&!e.shiftKey){

  e.preventDefault();
  sendMessage();

 }

});

input.addEventListener("input",()=>{

 input.style.height="48px";
 input.style.height=Math.min(input.scrollHeight,120)+"px";

});

/* ---------- SEND BUTTON ---------- */
document.getElementById("sendBtn").onclick=sendMessage;

/* ---------- INITIAL ---------- */
chat.innerHTML="";
addBot("🌙 Hai! Saya MoonBot V7 Ultra. Saya sedia membantu.");

</script>
